<script>
/* ---------- Lesson content: each topic has a real-world case, the idea, costs, and a live demo ---------- */
const TOPICS = [];

function insertSteps(base, index, value) {
  const out = [];
  const a = base.slice();
  const cells = (marks) => a.map((v, i) => ({ v, tag: (marks[i] && marks[i].tag) || '', cls: (marks[i] && marks[i].cls) || '' }));
  out.push({ caption: `Start: ${base.length} values sit side by side in one block.`, cells: cells({}) });
  a.push(null);
  out.push({ caption: 'Make room: the block needs one free slot at the end.', cells: cells({ [a.length - 1]: { tag: 'free' } }) });
  for (let j = a.length - 1; j > index; j--) {
    a[j] = a[j - 1];
    a[j - 1] = null;
    out.push({ caption: `Shift ${a[j]} one slot to the right.`, cells: cells({ [j]: { tag: 'moved', cls: 'cur' } }) });
  }
  a[index] = value;
  out.push({ caption: `Write ${value} into the gap at index ${index}.`, cells: cells({ [index]: { tag: 'new', cls: 'ok' } }) });
  out.push({ caption: `That insert moved ${base.length - index} values. In a list of a million, a middle insert can move almost a million.`, cells: cells({}) });
  return out;
}

function listDeleteSteps(vals, target) {
  const out = [];
  const t = vals.indexOf(target);
  const cells = (cur, skip) => vals.map((v, i) => ({
    v,
    tag: i === cur ? 'here' : (i === skip ? 'unlink' : ''),
    cls: i === skip ? 'skip' : (i === cur ? 'cur' : '')
  }));
  for (let i = 0; i <= t; i++) {
    const cap = i < t ? `${vals[i]} is not ${target}. Follow its arrow to the next node.` : `Found ${target}. The node before it is ${vals[t - 1]}.`;
    out.push({ caption: cap, cells: cells(i, -1) });
  }
  const after = t + 1 < vals.length ? vals[t + 1] : 'the end';
  out.push({ caption: `Re-point ${vals[t - 1]}'s arrow past ${target}, straight to ${after}.`, cells: cells(t - 1, t) });
  out.push({ caption: `${target} is unlinked. Only one arrow changed, so this step costs O(1).`, cells: vals.filter((_, i) => i !== t).map((v) => ({ v, tag: '', cls: '' })) });
  return out;
}

function stackQueueSteps() {
  const out = [];
  const stack = [];
  const queue = [];
  const showStack = (cap, extra) => out.push({
    caption: cap,
    cells: stack.map((v, i) => ({ v, tag: i === stack.length - 1 ? 'top' : '', cls: '' })).concat(extra || [])
  });
  const showQueue = (cap, extra) => out.push({
    caption: cap,
    cells: (extra || []).concat(queue.map((v, i) => ({ v, tag: i === 0 ? 'front' : (i === queue.length - 1 ? 'back' : ''), cls: '' })))
  });
  showStack('Stack: an empty pile. The top is the right-hand end.');
  for (const x of ['A', 'B', 'C']) { stack.push(x); showStack(`Push ${x}. It lands on top.`); }
  const popped = stack.pop();
  showStack(`Pop: ${popped} leaves first, because it went in last.`, [{ v: popped, tag: 'out', cls: 'skip' }]);
  showQueue('Queue: an empty line. New people join at the back.');
  for (const x of ['P', 'Q', 'R']) { queue.push(x); showQueue(`Enqueue ${x}. It joins the back of the line.`); }
  const served = queue.shift();
  showQueue(`Dequeue: ${served} is served first, because it arrived first.`, [{ v: served, tag: 'out', cls: 'skip' }]);
  return out;
}

function hashSteps() {
  const size = 5;
  const names = ['Ravi', 'Meera', 'Arjun', 'Lakshmi', 'Kiran'];
  const hash = (s) => [...s].reduce((sum, ch) => sum + ch.charCodeAt(0), 0) % size;
  const buckets = Array.from({ length: size }, () => []);
  const out = [];
  const show = (cap, hot) => out.push({ caption: cap, buckets: buckets.map((b) => b.slice()), hot });
  show(`Five empty buckets. A toy hash: add up the letter codes, then take the remainder after dividing by ${size}.`, -1);
  for (const n of names) {
    const i = hash(n);
    buckets[i].push(n);
    const clash = buckets[i].length > 1 ? ' That is a collision, so the bucket now holds a short list.' : '';
    show(`hash("${n}") = ${i}, so ${n} goes into bucket ${i}.${clash}`, i);
  }
  const key = 'Kiran';
  const j = hash(key);
  show(`Lookup "${key}": hash it, jump straight to bucket ${j}, and scan only that bucket.`, j);
  show(`Found ${key} after ${buckets[j].indexOf(key) + 1} check, not after checking all ${names.length} names.`, j);
  return out;
}

TOPICS.push({
  id: 'big-o',
  name: 'Big-O: counting work',
  hook: 'How cost grows as the data grows. Every choice in this guide is judged this way.',
  caseTitle: 'A million contacts',
  caseText: 'Your phone has a million contacts. Scanning them one by one to find a name takes about 10 milliseconds at a hundred million simple steps per second. Comparing every contact with every other one, to find duplicates, is about a trillion comparisons, which takes around three hours. The code looks alike; the growth rate decides whether it survives.',
  idea: [
    'Big-O describes how the work grows as the input size n grows. It ignores constant factors, so O(2n) and O(n) are both linear.',
    'O(1) means the same work at any size. O(log n) grows by one step each time the data doubles.',
    'O(n) grows in step with the data. O(n²) grows with the square, so doubling the data quadruples the work.'
  ],
  ops: [
    ['Constant', 'O(1)', 'Read an array slot, push onto a stack'],
    ['Logarithmic', 'O(log n)', 'Binary search: halve the search space each step'],
    ['Linear', 'O(n)', 'Scan every item once'],
    ['Linearithmic', 'O(n log n)', 'Efficient sorting, such as merge sort'],
    ['Quadratic', 'O(n²)', 'Compare every pair, nested loops']
  ],
  where: [],
  renderer: 'scale',
  insight: 'Before optimizing, ask how the work grows as the input grows, not how fast one run feels.',
  theory: [
    { level: 'Basic', title: 'What Big-O measures', points: [
      'Big-O counts how the number of steps grows as the input size `n` grows. It is not a timer, so it ignores machine speed.',
      'Drop constants and small terms. `3n + 5` is O(n), and `n² + 100n` is O(n²) once n is large.',
      'Always name the input: `n` items, `m` edges, a window of `k`. A cost means nothing without one.'
    ] },
    { level: 'Intermediate', title: 'Counting loops and recursion', points: [
      'One loop over `n` items is O(n). Two nested loops over `n` are O(n²). A loop that halves its range each time is O(log n).',
      'Steps in sequence add, so O(n) followed by O(n²) is O(n²). Steps nested inside each other multiply.',
      'Best, average and worst cases can differ. A hash lookup is O(1) on average and O(n) in the worst case.'
    ] },
    { level: 'Advanced', title: 'Amortized and space costs', points: [
      'Amortized cost averages a costly step over many cheap ones. A dynamic array’s append is O(1) amortized, even though one resize copies everything.',
      'Space counts too. Recursion keeps one stack frame per active call, so a walk that goes `d` levels deep uses O(d) extra space.',
      'Lower bounds limit what is possible. Comparison-based sorting cannot beat O(n log n) in the worst case, so faster sorts must exploit the data’s structure.'
    ] }
  ],
  practice: []
});

TOPICS.push({
  id: 'arrays',
  name: 'Arrays',
  hook: 'Fast to read by position, expensive to change in the middle.',
  caseTitle: 'A cinema row',
  caseText: 'Seats 1 to 20 sit in one row. Finding seat 14 takes one look, because you know exactly where it is. Now a late group needs a seat between 5 and 6. Everyone to the right has to shift along by one, and if the row is full, the hall must make room at the end. That shifting is the whole cost of the middle.',
  idea: [
    'An array stores items in one continuous block, so index i is found with simple arithmetic: start address plus i times the item size.',
    'Appending is usually free. When the block is full, the language copies everything into a bigger block, which is occasionally expensive.',
    'Inserting or deleting in the middle moves every item after that point. That is the price of keeping the block gapless.'
  ],
  ops: [
    ['Read by index', 'O(1)', 'arr[14]: go straight to the slot'],
    ['Search by value', 'O(n)', 'Check each slot until you find it'],
    ['Append', 'O(1) amortized', 'Usually free; rarely a copy to a bigger block'],
    ['Insert or delete in the middle', 'O(n)', 'Every later item shifts by one slot']
  ],
  where: ['Pixels in one row of an image', 'Characters in a string', 'Frames in a video buffer', 'Daily prices behind a stock chart'],
  renderer: 'cells',
  steps: () => insertSteps([3, 8, 12, 19, 25], 2, 10),
  insight: 'Arrays win when you read by position far more often than you insert in the middle.',
  theory: [
    { level: 'Basic', title: 'What an array is', points: [
      'An array is a row of equal-sized slots in one block of memory. Slot `i` sits at start + i × size, so the address is computed, not searched for.',
      'Reading by index is O(1). You never walk from the start to reach slot 500.',
      'A plain array has a fixed length. A dynamic array (Python list, Java ArrayList, C++ vector) copies itself into a bigger block when it fills.'
    ] },
    { level: 'Intermediate', title: 'Operations and their costs', points: [
      'Insert or delete in the middle shifts everything after that point, so it costs O(n).',
      'Append to the end is O(1) amortized for a dynamic array. Capacity doubles, so the expensive copies are rare.',
      'Searching an unsorted array is O(n). Binary search on a sorted array is O(log n), which is why sorted data is worth keeping.'

function bstSteps() {
  let root = null;
  const insert = (node, v) => {
    if (!node) return { v, l: null, r: null };
    if (v < node.v) node.l = insert(node.l, v); else node.r = insert(node.r, v);
    return node;
  };
  [8, 3, 10, 1, 6, 14, 4, 7, 13].forEach((v) => { root = insert(root, v); });
  const out = [];
  const search = (target) => {
    let node = root;
    const visited = [];
    while (node) {
      const lead = node === root ? `Search for ${target}. ` : '';
      visited.push(String(node.v));
      if (node.v === target) {
        out.push({ caption: `${lead}${target} matches. Found it after ${visited.length} comparisons.`, cur: String(node.v), ok: [String(node.v)], hi: visited.slice(0, -1) });
        return;
      }
      const dir = target < node.v ? 'smaller, so go left' : 'bigger, so go right';
      out.push({ caption: `${lead}At ${node.v}: ${target} is ${dir}.`, cur: String(node.v), ok: [], hi: visited.slice(0, -1) });
      node = target < node.v ? node.l : node.r;
    }
    out.push({ caption: `Reached an empty spot. ${target} is not in the tree, after ${visited.length} comparisons.`, cur: visited[visited.length - 1], ok: [], hi: visited.slice(0, -1) });
  };
  search(7);
  search(11);
  return out;
}

function heapSteps(vals) {
  const h = [];
  const out = [];
  const show = (cap, marks) => out.push({
    caption: cap,
    cells: h.map((v, i) => ({ v, tag: (marks[i] && marks[i].tag) || '', cls: (marks[i] && marks[i].cls) || '' }))
  });
  for (const v of vals) {
    h.push(v);
    let i = h.length - 1;
    show(`A patient with urgency ${v} joins at the end. Lower number means more urgent.`, { [i]: { tag: 'new' } });
    while (i > 0) {
      const p = (i - 1) >> 1;
      if (h[p] <= h[i]) break;
      [h[p], h[i]] = [h[i], h[p]];
      show(`${h[p]} is more urgent than its parent, so it swaps up.`, { [i]: { cls: 'cur' }, [p]: { cls: 'cur' } });
      i = p;
    }
  }
  show('Heap order holds. The most urgent patient is at the top.', { 0: { tag: 'top', cls: 'ok' } });
  const served = h[0];
  show(`Serve the most urgent patient, urgency ${served}.`, { 0: { tag: 'serve', cls: 'skip' } });
  const last = h.pop();
  if (h.length) {
    h[0] = last;
    show(`Move the last patient, urgency ${last}, to the top.`, { 0: { cls: 'cur' } });
    let i = 0;
    for (;;) {
      const l = 2 * i + 1;
      const r = l + 1;
      let m = i;
      if (l < h.length && h[l] < h[m]) m = l;
      if (r < h.length && h[r] < h[m]) m = r;
      if (m === i) break;
      [h[i], h[m]] = [h[m], h[i]];
      show(`${h[m]} sinks down, swapping with its more urgent child.`, { [i]: { cls: 'cur' }, [m]: { cls: 'cur' } });
      i = m;
    }
  }
  show('Heap order restored. The next most urgent patient is back at the top.', { 0: { tag: 'top', cls: 'ok' } });
  return out;
}

function bfsSteps(edges, start) {
  const adj = {};
  for (const [a, b] of edges) {
    (adj[a] = adj[a] || []).push(b);
    (adj[b] = adj[b] || []).push(a);
  }
  const dist = { [start]: 0 };
  const queue = [start];
  const done = [];
  const out = [];
  out.push({ caption: `Start at ${start} and put ${start} in the queue. Friends are one hop away; friends of friends are two.`, cur: null, ok: [], hi: [start], queue: [start] });
  while (queue.length) {
    const p = queue.shift();
    const fresh = [];
    for (const f of adj[p] || []) {
      if (dist[f] === undefined) { dist[f] = dist[p] + 1; queue.push(f); fresh.push(f); }
    }
    const hops = dist[p];
    const tail = fresh.length ? `New in the queue: ${fresh.join(', ')}.` : 'No new people to add.';
    out.push({ caption: `Visit ${p}, ${hops} hop${hops === 1 ? '' : 's'} from ${start}. ${tail}`, cur: p, ok: done.slice(), hi: queue.slice(), queue: queue.slice() });
    done.push(p);
  }
  out.push({ caption: `Queue empty. Everyone reachable from ${start} was visited, nearest rings first.`, cur: null, ok: done.slice(), hi: [], queue: [] });
  return out;
}

function bsearchSteps(arr, target) {
  const out = [];
  let lo = 0;
  let hi = arr.length - 1;
  let guesses = 0;
  const show = (cap, mid) => out.push({
    caption: cap,
    cells: arr.map((v, i) => {
      const tags = [];
      if (i === lo) tags.push('lo');
      if (i === mid) tags.push('mid');
      if (i === hi) tags.push('hi');
      const outside = i < lo || i > hi;
      return { v, tag: tags.join(' '), cls: outside ? 'skip' : (i === mid ? 'cur' : '') };
    })
  });
  show(`Looking for ${target} in ${arr.length} sorted values. Each guess can discard half of what is left.`, -1);
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    guesses++;
    if (arr[mid] === target) {
      show(`Index ${mid} holds ${target}. Found it in ${guesses} guesses.`, mid);
      return out;
    }
    if (arr[mid] < target) {
      show(`${arr[mid]} is less than ${target}, so everything left of it is too small. Move lo up.`, mid);
      lo = mid + 1;
    } else {
      show(`${arr[mid]} is more than ${target}, so everything right of it is too big. Move hi down.`, mid);
      hi = mid - 1;
    }
  }
  show(`The range is empty. ${target} is not in the list.`, -1);
  return out;
}

function coinSteps(amount, coins) {
  const INF = Infinity;
  const dp = [0];
  for (let a = 1; a <= amount; a++) dp.push(INF);
  const out = [];
  const cellsNow = (cur) => dp.map((v, i) => ({ v: v === INF ? '∞' : v, tag: i === cur ? 'now' : '', cls: i === cur ? 'cur' : '' }));
  out.push({ caption: `Goal: the fewest coins for ${amount}, using coins worth ${coins.join(', ')}. Amount 0 needs 0 coins.`, cells: cellsNow(0) });
  for (let a = 1; a <= amount; a++) {
    let best = INF;
    let pick = 0;
    for (const c of coins) {
      if (c <= a && dp[a - c] + 1 < best) { best = dp[a - c] + 1; pick = c; }
    }
    dp[a] = best;
    const cap = best === INF
      ? `${a}: no combination of these coins makes ${a}.`
      : `${a}: best is ${best} coin${best === 1 ? '' : 's'}, using a ${pick} and then the best answer for ${a - pick}.`;
    out.push({ caption: cap, cells: cellsNow(a) });
  }
  out.push({ caption: `A greedy shortcut would grab 4 first, then 1 and 1: 3 coins. The table finds 2 coins: 3 + 3.`, cells: cellsNow(-1) });
  return out;
}

function insertionSortSteps(input) {
  const a = input.slice();
  const out = [];
  const show = (cap, cur, sortedTo) => out.push({
    caption: cap,
    cells: a.map((v, i) => ({ v, tag: i === cur ? 'key' : '', cls: i === cur ? 'cur' : (i <= sortedTo ? 'ok' : '') }))
  });
  show('Unsorted values. The left part is sorted so far, and it holds only the first value.', -1, 0);
  for (let i = 1; i < a.length; i++) {
    const key = a[i];
    let j = i;
    show(`Take ${key} and compare it with the sorted values on its left.`, i, i - 1);
    while (j > 0 && a[j - 1] > key) {
      a[j] = a[j - 1];
      j--;
      show(`${a[j + 1]} is bigger than ${key}, so it slides one place right.`, j, i - 1);
    }
    a[j] = key;
    show(`${key} settles at position ${j}. The sorted part now holds ${i + 1} values.`, j, i);
  }
  show('Done. Every value is in place. Worst case grows with n², but nearly sorted input stays close to n.', -1, a.length - 1);
  return out;
}

function nextWarmerSteps(temps) {
  const out = [];
  const ans = temps.map(() => 0);
  const stack = [];
  const show = (cap, cur, waiting) => out.push({
    caption: cap,
    cells: temps.map((t, i) => ({
      v: t,
      tag: i === cur ? 'today' : (ans[i] ? `+${ans[i]}` : ''),
      cls: i === cur ? 'cur' : (waiting.includes(i) ? 'hot' : (ans[i] ? 'ok' : ''))
    }))
  });
  show('Each cell is one day’s temperature. The stack holds the days still waiting for a warmer day.', -1, []);
  for (let i = 0; i < temps.length; i++) {
    show(`Day ${i} is ${temps[i]}. Check the waiting days that are colder than it.`, i, stack.slice());
    while (stack.length && temps[stack[stack.length - 1]] < temps[i]) {
      const j = stack.pop();
      ans[j] = i - j;
      show(`${temps[j]} on day ${j} waited ${i - j} day${i - j === 1 ? '' : 's'} for ${temps[i]}. Pop it.`, i, stack.slice());
    }
    stack.push(i);
    show(`Day ${i} now waits for a warmer day.`, i, stack.slice());
  }
  show('Days still waiting at the end have no warmer day ahead, so their answer stays 0.', -1, stack.slice());
  return out;
}

function palindromeSteps(word) {
  const out = [];
  const chars = [...word];
  let l = 0;
  let r = chars.length - 1;
  const show = (cap, cls) => out.push({
    caption: cap,
    cells: chars.map((c, i) => ({ v: c, tag: i === l ? 'left' : (i === r ? 'right' : ''), cls: (i === l || i === r) ? cls : '' }))
  });
  show(`Put one pointer on the first letter and one on the last, in "${word}".`, 'cur');
  while (l < r) {
    const same = chars[l] === chars[r];
    show(`${chars[l]} and ${chars[r]} ${same ? 'match, so move both pointers inward.' : 'differ, so this is not a palindrome.'}`, same ? 'ok' : 'hot');
    if (!same) return out;
    l++;
    r--;
  }
  show('The pointers met with no mismatch, so the word reads the same both ways.', 'ok');
  return out;
}

  id: 'count-inversions', topic: 'sorting', title: 'How far apart are two rankings?', level: 'Hard',
  story: 'Two judges ranked the same contestants. The number of pairs they ordered differently measures how far apart their rankings are.',
  statement: 'Given an array of distinct numbers, return how many pairs (i, j) with i < j have nums[i] > nums[j]. Aim for O(n log n) by building on merge sort.',
  examples: 'nums = [2, 4, 1, 3, 5]  ->  3  (the pairs 2-1, 4-1 and 4-3)\nnums = [5, 4, 3, 2, 1]  ->  10',
  fn: 'countInversions',
  starter: 'function countInversions(nums) {\n  // Split the list, count inversions in each half, then count the ones that cross the split while merging.\n}',
  hint: 'While merging, if a value from the right half goes out first, it is smaller than every value still waiting in the left half.',
  solution: `function countInversions(nums) {
  const a = nums.slice();
  const tmp = new Array(a.length);
  const sortCount = (lo, hi) => {
    if (hi - lo < 1) return 0;
    const mid = (lo + hi) >> 1;
    let count = sortCount(lo, mid) + sortCount(mid + 1, hi);
    let i = lo;
    let j = mid + 1;
    let k = lo;
    while (i <= mid && j <= hi) {
      if (a[i] <= a[j]) tmp[k++] = a[i++];
      else { tmp[k++] = a[j++]; count += mid - i + 1; }
    }
    while (i <= mid) tmp[k++] = a[i++];
    while (j <= hi) tmp[k++] = a[j++];
    for (let x = lo; x <= hi; x++) a[x] = tmp[x];
    return count;
  };
  return sortCount(0, a.length - 1);
}`,

    { args: [[2, 4, 1, 3, 5]], expect: 3 },
    { args: [[5, 4, 3, 2, 1]], expect: 10 },
    { args: [[1, 2, 3]], expect: 0 },
    { args: [[3, 1]], expect: 1 }
  ]
});

  solution: `function permutations(nums) {

      return;

      used[i] = true;

  examples: 'grid = [A B C E / S F C S / A D E E]\nword "ABCCED"  ->  true\nword "SEE"  ->  true\nword "ABCB"  ->  false   (it would reuse the B)',
  fn: 'wordSearch',
  starter: 'function wordSearch(grid, word) {\n  // Try every starting cell. From each cell, recurse into the four neighbours, and undo the mark when you backtrack.\n}',
  hint: 'Mark a cell as used while it is on the current path. Unmark it before returning, so other paths can use it.',
  solution: `function wordSearch(grid, word) {
  const rows = grid.length;
  const cols = rows ? grid[0].length : 0;
  const seen = grid.map((row) => row.map(() => false));
  const walk = (r, c, k) => {
    if (k === word.length) return true;
    if (r < 0 || c < 0 || r >= rows || c >= cols || seen[r][c]) return false;
    if (grid[r][c] !== word[k]) return false;
    seen[r][c] = true;
    const found = walk(r + 1, c, k + 1) || walk(r - 1, c, k + 1) || walk(r, c + 1, k + 1) || walk(r, c - 1, k + 1);
    seen[r][c] = false;
    return found;
  };
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (walk(r, c, 0)) return true;
    }
  }
  return false;
}`,
  tests: [
    { args: [[['A', 'B', 'C', 'E'], ['S', 'F', 'C', 'S'], ['A', 'D', 'E', 'E']], 'ABCCED'], expect: true },
    { args: [[['A', 'B', 'C', 'E'], ['S', 'F', 'C', 'S'], ['A', 'D', 'E', 'E']], 'SEE'], expect: true },
    { args: [[['A', 'B', 'C', 'E'], ['S', 'F', 'C', 'S'], ['A', 'D', 'E', 'E']], 'ABCB'], expect: false },
    { args: [[['A']], 'A'], expect: true }
  ]
});

  examples: 'heights = [2, 1, 5, 6, 2, 3]  ->  10  (the 5 and 6 bars, width 2, height 5)\nheights = [2, 4]  ->  4',
  fn: 'largestRectangle',
  starter: 'function largestRectangle(heights) {\n  // Keep bar indexes in increasing height. When a shorter bar arrives, close out the taller bars it cuts off.\n}',
  hint: 'When you pop a bar, its rectangle reaches left to the bar below it on the stack, and right to the current index minus one.',
  solution: `function largestRectangle(heights) {
  const stack = [];
  let best = 0;
  for (let i = 0; i <= heights.length; i++) {
    const h = i === heights.length ? 0 : heights[i];
    while (stack.length && heights[stack[stack.length - 1]] >= h) {
      const top = stack.pop();
      const left = stack.length ? stack[stack.length - 1] + 1 : 0;

  statement: 'Write a class DisjointSet(n) for people numbered 0 to n − 1, each starting alone. union(a, b) joins their circles. connected(a, b) returns true when they share a circle. count() returns how many circles exist. union returns nothing.',
  examples: 'new DisjointSet(5); union(0, 1); union(1, 2)\nconnected(0, 2)  ->  true\ncount()  ->  3',
  fn: 'DisjointSet',
  starter: 'class DisjointSet {\n  constructor(n) {\n    // Each person starts as the root of their own circle.\n  }\n  find(x) {}\n  union(a, b) {}\n  connected(a, b) {}\n  count() {}\n}',
  hint: 'Keep a parent array and a size array. find walks up to the root, and union attaches the smaller root under the larger one.',
  solution: `class DisjointSet {
  constructor(n) {
    this.parent = Array.from({ length: n }, (_, i) => i);
    this.size = new Array(n).fill(1);
    this.groups = n;
  }
  find(x) {
    if (this.parent[x] !== x) this.parent[x] = this.find(this.parent[x]);
    return this.parent[x];
  }
  union(a, b) {
    let ra = this.find(a);
    let rb = this.find(b);
    if (ra === rb) return;
    if (this.size[ra] < this.size[rb]) [ra, rb] = [rb, ra];
    this.parent[rb] = ra;
    this.size[ra] += this.size[rb];
    this.groups--;
  }
  connected(a, b) {
    return this.find(a) === this.find(b);
  }
  count() {
    return this.groups;
  }
}`,

  id: 'cheapest-route', topic: 'shortest-paths', title: 'The fastest route, not the shortest', level: 'Medium',
  story: 'A delivery app knows the minutes between neighbouring areas. It needs the quickest total time from the depot to a customer, which can mean more turns.',
  statement: 'Given a graph as an object mapping each place to a list of [neighbour, minutes] pairs, return the least total minutes from src to dst, or -1 if dst cannot be reached. Weights are never negative.',
  examples: 'graph = { A: [["B", 4], ["C", 1]], B: [["D", 1]], C: [["B", 2], ["D", 7]], D: [] }\nsrc = "A", dst = "D"  ->  4   (A to C to B to D)',
  fn: 'shortestTime',
  starter: 'function shortestTime(graph, src, dst) {\n  // Settle the nearest unsettled place each time. Then try to improve the distances of its neighbours.\n}',
  hint: 'Keep the best known distance to each place. Always settle the unsettled place with the smallest distance, then relax the roads leaving it.',
  solution: `function shortestTime(graph, src, dst) {
  const dist = new Map([[src, 0]]);
  const done = new Set();
  while (true) {
    let node = null;
    for (const [v, d] of dist) {
      if (!done.has(v) && (node === null || d < dist.get(node))) node = v;
    }
    if (node === null) return -1;
    if (node === dst) return dist.get(node);
    done.add(node);
    for (const [next, w] of graph[node] || []) {
      const candidate = dist.get(node) + w;
      if (!dist.has(next) || candidate < dist.get(next)) dist.set(next, candidate);
    }
  }
}`,

PROBLEMS.push({
  id: 'lru-cache-pages', topic: 'lru-cache', title: 'A page cache that forgets the coldest page', level: 'Hard',
  story: 'A browser keeps a fixed number of pages in memory. When it is full, it drops the page you visited longest ago.',
  statement: 'Write a class LRUCache(capacity). get(key) returns the stored value, or -1 if the key is absent, and marks the key as most recently used. put(key, value) stores or updates a key as most recently used. When adding a new key would exceed the capacity, evict the least recently used key. Both methods run in O(1).',
  examples: 'cache = LRUCache(2); put(1, 1); put(2, 2); get(1)  ->  1\nput(3, 3) evicts key 2; get(2)  ->  -1; get(3)  ->  3',
  fn: 'LRUCache',
  starter: 'class LRUCache {\n  constructor(capacity) {\n    // Keep a hash map from key to node, and a doubly linked list ordered by recency.\n  }\n  get(key) {}\n  put(key, value) {}\n}',
  hint: 'Hold the nodes in a doubly linked list between dummy head and tail nodes. Unlink a node to move it, and push it to the front when it is used.',
  solution: `class LRUCache {
  constructor(capacity) {
    this.capacity = capacity;
    this.map = new Map();
    this.head = { key: null, value: null, prev: null, next: null };
    this.tail = { key: null, value: null, prev: null, next: null };
    this.head.next = this.tail;
    this.tail.prev = this.head;
  }
  unlink(node) {
    node.prev.next = node.next;
    node.next.prev = node.prev;
  }
  pushFront(node) {
    node.next = this.head.next;
    node.prev = this.head;
    this.head.next.prev = node;
    this.head.next = node;
  }
  get(key) {
    const node = this.map.get(key);
    if (!node) return -1;
    this.unlink(node);
    this.pushFront(node);
    return node.value;
  }
  put(key, value) {
    const existing = this.map.get(key);
    if (existing) {
      this.unlink(existing);
      this.map.delete(key);
    }
    const node = { key, value, prev: null, next: null };
    this.map.set(key, node);
    this.pushFront(node);
    if (this.map.size > this.capacity) {
      const coldest = this.tail.prev;
      this.unlink(coldest);
      this.map.delete(coldest.key);
    }
  }
}`,
  tests: [
    { kind: 'ops', init: [2], ops: [['put', 1, 1], ['put', 2, 2], ['get', 1], ['put', 3, 3], ['get', 2], ['put', 4, 4], ['get', 1], ['get', 3], ['get', 4]], expect: [null, null, 1, null, -1, null, -1, 3, 4] },
    { kind: 'ops', init: [1], ops: [['put', 2, 1], ['get', 2], ['put', 3, 2], ['get', 2], ['get', 3]], expect: [null, 1, null, -1, 2] },
    { kind: 'ops', init: [2], ops: [['put', 1, 1], ['put', 1, 5], ['get', 1]], expect: [null, null, 5] }
  ]
});

PROBLEMS.push({
  id: 'find-pattern', topic: 'string-matching', title: 'Find the phrase in one pass', level: 'Hard',
  story: 'An editor’s Find button must jump to the first occurrence of a phrase in a long document, without rereading the document after each mismatch.',
  statement: 'Given a text and a pattern, return the index of the first occurrence of the pattern in the text, or -1 if it does not occur. An empty pattern matches at index 0. Aim for O(n + m) with the KMP failure table.',
  examples: 'text = "ababcabcabababd", pattern = "ababd"  ->  10\ntext = "hello world", pattern = "world"  ->  6\ntext = "abc", pattern = "d"  ->  -1',
  fn: 'findPattern',
  starter: 'function findPattern(text, pattern) {\n  // Build the failure table for the pattern first. Then scan the text, falling back in the pattern when a letter does not match.\n}',
  hint: 'failure[k] is the length of the longest proper prefix of pattern[0..k] that is also a suffix of it. On a mismatch at pattern position k, jump to failure[k - 1].',
  solution: `function findPattern(text, pattern) {
  if (pattern.length === 0) return 0;
  const fail = new Array(pattern.length).fill(0);
  for (let i = 1, k = 0; i < pattern.length; i++) {
    while (k > 0 && pattern[i] !== pattern[k]) k = fail[k - 1];
    if (pattern[i] === pattern[k]) k++;
    fail[i] = k;
  }
  for (let i = 0, k = 0; i < text.length; i++) {
    while (k > 0 && text[i] !== pattern[k]) k = fail[k - 1];
    if (text[i] === pattern[k]) k++;
    if (k === pattern.length) return i - pattern.length + 1;
  }
  return -1;
}`,
  tests: [
    { args: ['ababcabcabababd', 'ababd'], expect: 10 },
    { args: ['aaaa', 'aa'], expect: 0 },
    { args: ['hello world', 'world'], expect: 6 },
    { args: ['abc', 'd'], expect: -1 },
    { args: ['abc', ''], expect: 0 }
  ]
});

  fn: 'editDistance',
  starter: 'function editDistance(a, b) {\n  // Cell (i, j) is the cost of turning the first i characters of a into the first j characters of b.\n}',
  hint: 'If the last characters match, the diagonal cell costs nothing extra. Otherwise take 1 plus the cheapest of the cell above (delete), the cell to the left (insert), or the diagonal (substitute).',
  solution: `function editDistance(a, b) {

  id: 'number-of-islands', topic: 'graphs', title: 'Counting islands in a satellite image', level: 'Medium',
  story: 'A satellite image is a grid of land (1) and water (0). Land that touches up, down, left or right forms one island.',
  statement: 'Given a grid of 0s and 1s, return the number of islands. Cells that touch only diagonally are not connected.',
  examples: '[[1, 1, 0], [0, 1, 0], [0, 0, 1]]  ->  2\n[[1, 0, 1], [0, 1, 0], [1, 0, 1]]  ->  5',
  fn: 'countIslands',
  starter: 'function countIslands(grid) {\n  // Scan every cell. Each time you find unvisited land, count an island and flood-fill it.\n}',
  hint: 'Flood-fill with a search that visits the four neighbours and never revisits a cell. Mark cells as you go.',
  solution: `function countIslands(grid) {
  const rows = grid.length;
  const cols = rows ? grid[0].length : 0;
  const seen = grid.map((row) => row.map(() => false));
  let count = 0;
  const sink = (r, c) => {
    if (r < 0 || c < 0 || r >= rows || c >= cols) return;
    if (seen[r][c] || grid[r][c] !== 1) return;
    seen[r][c] = true;
    sink(r + 1, c);
    sink(r - 1, c);
    sink(r, c + 1);
    sink(r, c - 1);
  };
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (grid[r][c] === 1 && !seen[r][c]) {
        count++;
        sink(r, c);
      }
    }
  }
  return count;
}`,

    { args: [[[1, 1, 0], [0, 1, 0], [0, 0, 1]]], expect: 2 },

    { args: [[[1, 1], [1, 1]]], expect: 1 }
  ]
});

  id: 'course-order', topic: 'graphs', title: 'Can a student finish the course list?', level: 'Hard',
  story: 'A university lists which courses must come first. A student asks whether every course can be completed, given that no course depends on itself through a loop.',
  statement: 'Given numCourses and a list of [course, prerequisite] pairs, return true if all courses can be taken in some order, and false if the prerequisites form a cycle.',
  examples: 'numCourses = 2, prerequisites = [[1, 0]]  ->  true\nnumCourses = 2, prerequisites = [[1, 0], [0, 1]]  ->  false',
  fn: 'canFinish',
  starter: 'function canFinish(numCourses, prerequisites) {\n  // Topological sort: take courses with no unmet prerequisites first.\n}',
  hint: 'Count unmet prerequisites per course. Repeatedly take a course whose count is zero and lower the counts of the courses waiting on it. If some course is never taken, there is a cycle.',
  solution: `function canFinish(numCourses, prerequisites) {
  const indegree = new Array(numCourses).fill(0);
  const unlocks = Array.from({ length: numCourses }, () => []);
  for (const [course, pre] of prerequisites) {
    indegree[course]++;
    unlocks[pre].push(course);
  }
  const ready = [];
  for (let c = 0; c < numCourses; c++) {
    if (indegree[c] === 0) ready.push(c);
  }
  let taken = 0;
  while (ready.length) {
    const c = ready.pop();
    taken++;
    for (const next of unlocks[c]) {
      indegree[next]--;
      if (indegree[next] === 0) ready.push(next);
    }
  }
  return taken === numCourses;
}`,

    { args: [4, [[1, 0], [2, 1], [3, 2]]], expect: true },

  ]
});

  examples: 'push(1), push(2), peek()  ->  1\npop()  ->  1,  empty()  ->  false,  pop()  ->  2,  empty()  ->  true',
  fn: 'MyQueue',
  starter: 'class MyQueue {\n  constructor() {\n    // Use two stacks: one for arrivals, one for the order they leave in.\n  }\n  push(x) {}\n  pop() {}\n  peek() {}\n  empty() {}\n}',
  hint: 'New values go on the inbox stack. When the outbox is empty, pour the inbox into it, which reverses the order, so the oldest value is on top.',
  solution: `class MyQueue {
  constructor() {
    this.inbox = [];
    this.outbox = [];
  }
  refill() {
    if (this.outbox.length === 0) {
      while (this.inbox.length) this.outbox.push(this.inbox.pop());
    }
  }
  push(x) {
    this.inbox.push(x);
  }
  pop() {
    this.refill();
    return this.outbox.pop();
  }
  peek() {
    this.refill();
    return this.outbox[this.outbox.length - 1];
  }
  empty() {
    return this.inbox.length === 0 && this.outbox.length === 0;
  }
}`,

  solution: `function searchRotated(nums, target) {

  fn: 'countQueens',
  starter: 'function countQueens(n) {\n  // Place one queen per row. Remember which columns and diagonals are already taken.\n}',
  hint: 'Track columns, and the diagonals row − col and row + col. Each diagonal has one value for each of its squares, so a set works well.',
  solution: `function countQueens(n) {
  const cols = new Set();
  const diag1 = new Set();
  const diag2 = new Set();
  let count = 0;

    if (row === n) {
      count++;
      return;
    }
    for (let c = 0; c < n; c++) {

      diag2.add(row + c);
      place(row + 1);

  };
  place(0);
  return count;
}`,

  solution: `function decodeString(s) {

      num = 0;

  fn: 'multiplyStrings',
  starter: 'function multiplyStrings(a, b) {\n  // Multiply digit by digit into a result array, then carry the extra tens.\n}',
  hint: 'The product of an m-digit and an n-digit number has at most m + n digits. Digit i times digit j lands at positions i + j and i + j + 1.',
  solution: `function multiplyStrings(a, b) {
  if (a === '0' || b === '0') return '0';
  const res = new Array(a.length + b.length).fill(0);

    for (let j = b.length - 1; j >= 0; j--) {
      const sum = res[i + j + 1] + Number(a[i]) * Number(b[j]);
      res[i + j + 1] = sum % 10;
      res[i + j] += Math.floor(sum / 10);
    }
  }
  while (res.length > 1 && res[0] === 0) res.shift();
  return res.join('');
}`,
  tests: [

  solution: `function zigzag(s, rows) {

  statement: 'Given a string of capital letters and a number k, return the length of the longest substring that can be made of one repeated letter after changing at most k letters.',
  examples: '"ABAB", 2  ->  4\n"AABABBA", 1  ->  4',
  fn: 'characterReplacement',
  starter: 'function characterReplacement(s, k) {\n  // Slide a window. Inside it, the letters that are not the most common one must fit in the budget k.\n}',
  hint: 'Track how often each letter appears in the window and the largest such count. The window is valid when its size minus that count is at most k.',
  solution: `function characterReplacement(s, k) {
  const count = new Map();
  let left = 0;
  let maxFreq = 0;
  let best = 0;
  for (let right = 0; right < s.length; right++) {
    count.set(s[right], (count.get(s[right]) || 0) + 1);
    maxFreq = Math.max(maxFreq, count.get(s[right]));
    while ((right - left + 1) - maxFreq > k) {
      count.set(s[left], count.get(s[left]) - 1);
      left++;
    }
    best = Math.max(best, right - left + 1);
  }
  return best;
}`,
  tests: [

    { args: ['AABABBA', 1], expect: 4 },
    { args: ['AAAA', 0], expect: 4 },

  ]
});

  solution: `function findAnagrams(s, p) {

  solution: `function minWindow(s, t) {
  const need = new Map();

  story: 'A file search accepts ? for any one character and * for any run of characters, and must decide whether a name matches.',
  statement: 'Given a string s and a pattern p containing lowercase letters, ? (exactly one character) and * (any sequence, including empty), return true if the whole string matches the whole pattern.',
  examples: '"aa", "a"  ->  false\n"aa", "*"  ->  true\n"adceb", "*a*b"  ->  true',
  fn: 'wildMatch',
  starter: 'function wildMatch(s, p) {\n  // dp[i][j] will say whether the first i characters of s match the first j characters of p.\n}',
  hint: 'A * can match nothing (look at dp[i][j - 1]) or one more character (look at dp[i - 1][j]).',
  solution: `function wildMatch(s, p) {
  const m = s.length;
  const n = p.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(false));
  dp[0][0] = true;
  for (let j = 1; j <= n; j++) {
    if (p[j - 1] === '*') dp[0][j] = dp[0][j - 1];
  }
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      if (p[j - 1] === '*') dp[i][j] = dp[i][j - 1] || dp[i - 1][j];
      else if (p[j - 1] === '?' || p[j - 1] === s[i - 1]) dp[i][j] = dp[i - 1][j - 1];
    }
  }
  return dp[m][n];
}`,

});

  fn: 'addBinary',
  starter: 'function addBinary(a, b) {\n  // Add from the rightmost digits, keeping a carry.\n}',
  hint: 'Each column sums two digits plus the carry. The remainder when divided by 2 is the output digit, and the quotient is the new carry.',
  solution: `function addBinary(a, b) {
  let i = a.length - 1;
  let j = b.length - 1;

  solution: `function minRemoveValid(s) {

PROBLEMS.push({
  id: 'reverse-only-letters', topic: 'strings', title: 'Reversing the letters, keeping the symbols', level: 'Easy',
  story: 'A product code keeps its dashes and symbols in place, and reverses only the letters around them.',
  statement: 'Given a string, reverse only its letters (a to z, either case), leaving every other character where it is.',
  examples: '"ab-cd"  ->  "dc-ba"\n"a-bC-dEf-ghIj"  ->  "j-Ih-gfE-dCba"',
  fn: 'reverseOnlyLetters',
  starter: 'function reverseOnlyLetters(s) {\n  // Two pointers. Skip symbols at either end, and swap two letters.\n}',
  hint: 'When the left pointer is on a symbol, move it right. When the right pointer is on a symbol, move it left. Otherwise swap.',
  solution: `function reverseOnlyLetters(s) {
  const arr = s.split('');
  const isLetter = (ch) => /[a-zA-Z]/.test(ch);
  let l = 0;
  let r = arr.length - 1;
  while (l < r) {
    if (!isLetter(arr[l])) l++;
    else if (!isLetter(arr[r])) r--;

      l++;

    }

}`,

  examples: '"eceba"  ->  3   ("ece")\n"ccaabbb"  ->  5   ("aabbb")',
  fn: 'lengthOfTwoDistinct',
  starter: 'function lengthOfTwoDistinct(s) {\n  // Slide a window and track how many of each character it holds. Shrink it whenever three kinds appear.\n}',
  hint: 'Keep a Map of counts. When the map has more than two keys, remove characters from the left until one key disappears.',
  solution: `function lengthOfTwoDistinct(s) {
  const count = new Map();
  let left = 0;
  let best = 0;
  for (let right = 0; right < s.length; right++) {
    count.set(s[right], (count.get(s[right]) || 0) + 1);
    while (count.size > 2) {
      const c = s[left];
      count.set(c, count.get(c) - 1);
      if (count.get(c) === 0) count.delete(c);

PROBLEMS.push({

  starter: 'function isOneEdit(a, b) {\n  // Find the first position where they differ. The rest must then line up after one edit.\n}',

  solution: `function isOneEdit(a, b) {

PROBLEMS.push({
  id: 'shortest-distance-to-char', topic: 'strings', title: 'Distance to the nearest exit sign', level: 'Easy',
  story: 'A map app shows how many steps each cell is from the nearest exit sign, marked by one letter.',
  statement: 'Given a string s and a character c that appears in it, return an array whose i-th value is the distance from position i to the nearest occurrence of c.',
  examples: '"loveleetcode", "e"  ->  [3, 2, 1, 0, 1, 0, 0, 1, 2, 2, 1, 0]',
  fn: 'shortestToChar',
  starter: 'function shortestToChar(s, c) {\n  // Sweep left to right, then right to left, keeping the nearest c seen so far.\n}',
  hint: 'Two passes: one remembers the last c on the left, the other the first c on the right. Keep the smaller distance.',
  solution: `function shortestToChar(s, c) {
  const out = new Array(s.length).fill(Infinity);
  let prev = -Infinity;
  for (let i = 0; i < s.length; i++) {
    if (s[i] === c) prev = i;
    out[i] = i - prev;
  }
  prev = Infinity;
  for (let i = s.length - 1; i >= 0; i--) {
    if (s[i] === c) prev = i;
    out[i] = Math.min(out[i], prev - i);
  }
  return out;
}`,
  tests: [
    { args: ['loveleetcode', 'e'], expect: [3, 2, 1, 0, 1, 0, 0, 1, 2, 2, 1, 0] },
    { args: ['aaab', 'b'], expect: [3, 2, 1, 0] },

});

  story: 'A rhyme checker confirms that each line ends with the same word whenever the pattern letter repeats.',
  statement: 'Given a pattern of letters and a sentence of words, return true if each letter maps to exactly one word and each word maps back to exactly one letter.',
  examples: '"abba", "dog cat cat dog"  ->  true\n"abba", "dog cat cat fish"  ->  false',
  fn: 'wordPattern',
  starter: 'function wordPattern(pattern, s) {\n  // Split the sentence into words. Check that the pattern and the words pair up one-to-one.\n}',
  hint: 'Keep two maps, letter to word and word to letter, and check both directions on each step.',
  solution: `function wordPattern(pattern, s) {
  const words = s.split(' ');
  if (words.length !== pattern.length) return false;
  const p2w = new Map();
  const w2p = new Map();
  for (let i = 0; i < pattern.length; i++) {
    const p = pattern[i];
    const w = words[i];
    if (p2w.has(p) && p2w.get(p) !== w) return false;
    if (w2p.has(w) && w2p.get(w) !== p) return false;
    p2w.set(p, w);
    w2p.set(w, p);
  }
  return true;
}`,
  tests: [
    { args: ['abba', 'dog cat cat dog'], expect: true },
    { args: ['abba', 'dog cat cat fish'], expect: false },
    { args: ['aaaa', 'dog cat cat dog'], expect: false },

  ]
});

  fn: 'longestPalindromeLength',
  starter: 'function longestPalindromeLength(s) {\n  // Every letter that appears twice or more can be used in pairs. One unpaired letter may sit in the middle.\n}',

  solution: `function longestPalindromeLength(s) {

PROBLEMS.push({

  examples: '[1, 2, 3], [2, 5, 6]  ->  [1, 2, 2, 3, 5, 6]',
  fn: 'mergeSorted',
  starter: 'function mergeSorted(a, b) {\n  // Keep one pointer in each array. Always take the smaller front value.\n}',
  hint: 'While both arrays have values, take the smaller of the two front values. Then copy whatever remains.',
  solution: `function mergeSorted(a, b) {
  const out = [];
  let i = 0;
  let j = 0;
  while (i < a.length && j < b.length) {
    if (a[i] <= b[j]) out.push(a[i++]);
    else out.push(b[j++]);
  }
  while (i < a.length) out.push(a[i++]);
  while (j < b.length) out.push(b[j++]);
  return out;
}`,
  tests: [
    { args: [[1, 2, 3], [2, 5, 6]], expect: [1, 2, 2, 3, 5, 6] },
    { args: [[], [1]], expect: [1] },

  fn: 'plusOne',

  hint: 'If every digit was 9, the result needs one extra leading 1.',
  solution: `function plusOne(digits) {

  solution: `function validMountain(arr) {

  starter: 'function canPlaceFlowers(flowerbed, n) {\n  // Plant greedily: a spot is usable when it and both neighbours are empty.\n}',

  id: 'max-average-subarray', topic: 'arrays', title: 'The hottest stretch of days', level: 'Easy',
  story: 'A temperature log is scanned for the stretch of k consecutive days with the highest average.',
  statement: 'Given an array of numbers and a window size k, return the largest average of any k consecutive values.',
  examples: '[1, 12, -5, -6, 50, 3], 4  ->  12.75',
  fn: 'findMaxAverage',
  starter: 'function findMaxAverage(nums, k) {\n  // Sum the first k values, then slide the window one step at a time, adding the new value and removing the old one.\n}',
  hint: 'Each slide changes the sum by nums[i] − nums[i − k]. Track the largest sum, then divide by k at the end.',
  solution: `function findMaxAverage(nums, k) {
  let sum = 0;
  for (let i = 0; i < k; i++) sum += nums[i];
  let best = sum;
  for (let i = k; i < nums.length; i++) {
    sum += nums[i] - nums[i - k];
    best = Math.max(best, sum);
  }
  return best / k;
}`,
  tests: [
    { args: [[1, 12, -5, -6, 50, 3], 4], expect: 12.75 },
    { args: [[5], 1], expect: 5 },
    { args: [[4, 4, 4, 4], 2], expect: 4 },
    { args: [[-1, -2, -3], 2], expect: -1.5 }
  ]

  story: 'A seating chart is read around the edge first, then inward, to call out rows in a spiral order.',
  statement: 'Given a matrix, return all its elements in spiral order: left to right across the top, down the right side, right to left along the bottom, then up the left side, and inward.',
  examples: '[[1, 2, 3], [4, 5, 6], [7, 8, 9]]  ->  [1, 2, 3, 6, 9, 8, 7, 4, 5]',
  fn: 'spiralOrder',
  starter: 'function spiralOrder(m) {\n  // Keep four boundaries: top, bottom, left and right. Walk each edge, then move that boundary inward.\n}',
  hint: 'Check the boundaries again before walking the bottom row and the left column, in case the matrix has only one row or column left.',
  solution: `function spiralOrder(m) {
  const out = [];
  let top = 0;
  let bottom = m.length - 1;
  let left = 0;
  let right = m.length ? m[0].length - 1 : -1;
  while (top <= bottom && left <= right) {
    for (let c = left; c <= right; c++) out.push(m[top][c]);
    top++;
    for (let r = top; r <= bottom; r++) out.push(m[r][right]);
    right--;
    if (top <= bottom) {
      for (let c = right; c >= left; c--) out.push(m[bottom][c]);
      bottom--;
    }

      left++;
    }
  }

  fn: 'maxCircularSubarray',
  starter: 'function maxCircularSubarray(nums) {\n  // A wrapping stretch is everything except one stretch in the middle. So the answer is the total minus the smallest stretch.\n}',
  hint: 'Compute the best plain subarray (Kadane) and the smallest plain subarray. If every value is negative, the plain best is the answer.',
  solution: `function maxCircularSubarray(nums) {

PROBLEMS.push({
  id: 'max-min-distance', topic: 'searching', title: 'Spreading out sensor poles', level: 'Hard',

  examples: '[1, 2, 3, 4, 7], 3  ->  3\n[5, 4, 3, 2, 1, 1000000000], 2  ->  999999999',
  fn: 'maxMinDistance',
  starter: 'function maxMinDistance(positions, m) {\n  // Sort the positions. Binary search the gap you want to guarantee.\n}',
  hint: 'Sort the positions and binary search the gap. For a gap, place sensors greedily from left to right, each at least the gap away from the last one.',
  solution: `function maxMinDistance(positions, m) {

  statement: 'Given two sorted arrays, return the median of all their values combined. For an even total, return the average of the two middle values. The arrays are never both empty. Aim for logarithmic time in the shorter array.',
  examples: '[1, 3], [2]  ->  2\n[1, 2], [3, 4]  ->  2.5',
  fn: 'findMedianSortedArrays',
  starter: 'function findMedianSortedArrays(a, b) {\n  // Binary search how many values to take from the shorter array into the left half.\n}',
  hint: 'Binary search how many values to take from the shorter array into the left half. A split is correct when every left value is at most every right value.',
  solution: `function findMedianSortedArrays(a, b) {
  if (a.length > b.length) return findMedianSortedArrays(b, a);
  const m = a.length;
  const n = b.length;
  const total = m + n;
  const half = Math.floor((total + 1) / 2);
  let lo = 0;
  let hi = m;
  while (lo <= hi) {
    const i = (lo + hi) >> 1;
    const j = half - i;
    const aLeft = i === 0 ? -Infinity : a[i - 1];
    const aRight = i === m ? Infinity : a[i];
    const bLeft = j === 0 ? -Infinity : b[j - 1];
    const bRight = j === n ? Infinity : b[j];
    if (aLeft <= bRight && bLeft <= aRight) {
      const leftMax = Math.max(aLeft, bLeft);
      if (total % 2 === 1) return leftMax;
      return (leftMax + Math.min(aRight, bRight)) / 2;
    }
    if (aLeft > bRight) hi = i - 1;
    else lo = i + 1;
  }
  return 0;

  tests: [
    { args: [[1, 3], [2]], expect: 2 },

PROBLEMS.push({
  id: 'closest-pair-sum', topic: 'searching', title: 'Two packages nearest a truck limit', level: 'Medium',
  story: 'Two packages must weigh together as close to a truck limit as possible. Try each package as the first one, and binary search for the partner that brings the total nearest the limit.',
  statement: 'Given an array of at least two whole numbers and a target, return the sum of two different elements that is closest to the target. If two sums are equally close, return the smaller sum.',
  examples: '[1, 3, 5], 100  ->  8\n[-5, -2, 0, 3], 1  ->  1\n[1, 2, 4, 8, 16], 10  ->  10',
  fn: 'closestPairSum',
  starter: 'function closestPairSum(nums, target) {\n  // Sort the values. For each first element, binary search for the partner that brings the sum nearest the target.\n}',
  hint: 'Sort the values. For each first element, binary search the second element that brings the sum nearest the target, and check the neighbour on each side of that spot.',
  solution: `function closestPairSum(nums, target) {
  const sorted = nums.slice().sort((a, b) => a - b);
  const n = sorted.length;
  let best = null;
  const consider = (s) => {
    if (best === null) { best = s; return; }
    const dCur = Math.abs(s - target);
    const dBest = Math.abs(best - target);
    if (dCur < dBest || (dCur === dBest && s < best)) best = s;
  };
  for (let i = 0; i < n - 1; i++) {
    const need = target - sorted[i];
    let lo = i + 1;
    let hi = n;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (sorted[mid] < need) lo = mid + 1;
      else hi = mid;
    }
    if (lo < n) consider(sorted[i] + sorted[lo]);
    if (lo - 1 > i) consider(sorted[i] + sorted[lo - 1]);
  }
  return best;
}`,
  tests: [
    { args: [[1, 3, 5], 100], expect: 8 },
    { args: [[-5, -2, 0, 3], 1], expect: 1 },
    { args: [[1, 2, 4, 8, 16], 10], expect: 10 },
    { args: [[-1, 2, 1, -4], 1], expect: 1 }

});

  id: 'multiplication-table-kth', topic: 'searching', title: 'k-th entry of a multiplication table', level: 'Hard',
  story: 'A printed multiplication table has m rows and n columns. Find the k-th smallest entry in the table without writing the whole table out.',
  statement: 'Given the table height m, the table width n and a number k, return the k-th smallest value in the m by n multiplication table, where entry (i, j) is i times j with rows and columns counted from 1. Duplicates count separately. Binary search on the value itself.',
  examples: '3, 3, 5  ->  3\n2, 3, 6  ->  6',
  fn: 'findKthNumber',
  starter: 'function findKthNumber(m, n, k) {\n  // For a value x, count the table entries that are at most x. Row i contributes min(n, floor(x / i)).\n}',
  hint: 'For a candidate value x, count how many table entries are at most x. Row i contributes min(n, floor(x / i)). Binary search the value.',
  solution: `function findKthNumber(m, n, k) {
  const countAtMost = (x) => {
    let count = 0;
    for (let i = 1; i <= m; i++) count += Math.min(n, Math.floor(x / i));
    return count;
  };
  let lo = 1;
  let hi = m * n;
  while (lo < hi) {
    const mid = Math.floor((lo + hi) / 2);
    if (countAtMost(mid) >= k) hi = mid;
    else lo = mid + 1;
  }
  return lo;
}`,

    { args: [2, 3, 6], expect: 6 },

  statement: 'Given a linked list and a whole number k, rotate the list to the right by k places and return the new head. Rotating by more than the length wraps around, so use k modulo the length.',
  examples: '[1, 2, 3, 4, 5], 2  ->  [4, 5, 1, 2, 3]\n[0, 1, 2], 4  ->  [2, 0, 1]',
  fn: 'rotateRight',
  starter: 'function rotateRight(head, k) {\n  // Find the length and the last node. Close the list into a loop, then cut it at the right place.\n}',
  hint: 'Count the length and find the last node. Close the list into a loop. The new tail is the node at position length minus k modulo length, counting from one. Walk there and cut the loop after it.',
  solution: `function rotateRight(head, k) {
  if (!head || !head.next) return head;
  let len = 1;
  let tail = head;

    len++;
  }
  const steps = k % len;
  if (steps === 0) return head;
  tail.next = head;
  let newTail = head;
  for (let i = 1; i < len - steps; i++) newTail = newTail.next;
  const newHead = newTail.next;
  newTail.next = null;
  return newHead;
}`,

  story: 'Packing crates are stacked in groups of a fixed size. Reverse the order inside each complete group, and leave a final short group as it is.',

  starter: 'function reverseKGroup(head, k) {\n  // First check that a full group of k nodes exists. Then reverse that group and continue with the next one.\n}',
  hint: 'Before reversing, check that k nodes remain. Reverse exactly those k nodes by re-linking, attach the reversed group to the previous group, and then continue from the next group.',
  solution: `function reverseKGroup(head, k) {
  const dummy = { val: 0, next: head };

  id: 'design-linked-list', topic: 'linked-lists', title: 'A linked list with index operations', level: 'Medium',
  story: 'A simple playlist stores songs in a chain. Build a list class that supports adding at the front, adding at the end, adding at a position, reading a position, and deleting a position.',
  statement: 'Design a singly linked list with these methods. get(index) returns the value at a position counted from zero, or -1 if the position is not valid. addAtHead(value) and addAtTail(value) add a value at the front or the end. addAtIndex(index, value) inserts before the given position, and does nothing if the position is greater than the length. deleteAtIndex(index) removes the node at that position if it is valid.',
  examples: 'addAtHead 1, addAtTail 3, addAtIndex 1 with 2, then get 1  ->  2\ndeleteAtIndex 1, then get 1  ->  3',
  fn: 'MyLinkedList',
  starter: 'class MyLinkedList {\n  // Keep a dummy head and a size counter. Walk to the node before the position for insert and delete.\n}',
  hint: 'Keep a dummy head and a size counter. For insert and delete, walk to the node just before the position. Check the position against the size first.',
  solution: `class MyLinkedList {
  constructor() {
    this.dummy = { val: 0, next: null };
    this.size = 0;
  }
  get(index) {
    if (index < 0 || index >= this.size) return -1;
    let cur = this.dummy.next;
    for (let i = 0; i < index; i++) cur = cur.next;
    return cur.val;
  }
  addAtHead(value) {
    this.addAtIndex(0, value);
  }
  addAtTail(value) {
    this.addAtIndex(this.size, value);
  }
  addAtIndex(index, value) {
    if (index > this.size) return;
    if (index < 0) index = 0;
    let prev = this.dummy;
    for (let i = 0; i < index; i++) prev = prev.next;
    prev.next = { val: value, next: prev.next };
    this.size++;
  }
  deleteAtIndex(index) {
    if (index < 0 || index >= this.size) return;
    let prev = this.dummy;
    for (let i = 0; i < index; i++) prev = prev.next;
    prev.next = prev.next.next;
    this.size--;
  }
}`,
  tests: [
    { kind: 'ops', init: [], ops: [['addAtHead', 1], ['addAtTail', 3], ['addAtIndex', 1, 2], ['get', 1], ['deleteAtIndex', 1], ['get', 1]], expect: [null, null, null, 2, null, 3] },

const fmtTime = (s) => {
  if (s < 0.001) return `${(s * 1e6).toFixed(0)} µs`;
  if (s < 1) return `${(s * 1000).toFixed(1)} ms`;
  if (s < 120) return `${s.toFixed(1)} s`;
  if (s < 7200) return `${(s / 60).toFixed(0)} min`;
  if (s < 172800) return `${(s / 3600).toFixed(1)} h`;
  if (s < 31536000) return `${(s / 86400).toFixed(0)} days`;
  return `${(s / 31536000).toFixed(0)} years`;
};

/* Visual renderers: each takes one step and returns HTML */
function renderCells(step) {
  const cells = step.cells.map((c, i) => {
    const empty = c.v === null || c.v === undefined;
    const cls = ['cell', empty ? 'empty' : '', c.cls || ''].join(' ').trim();
    const tag = c.tag ? `<span class="tag">${esc(c.tag)}</span>` : '';
    return `<div class="${cls}">${tag}${empty ? '&nbsp;' : esc(c.v)}<span class="idx">${i}</span></div>`;
  });
  return `<div class="cells">${cells.join('')}</div>`;
}

function renderBuckets(step) {
  const rows = step.buckets.map((b, i) => {
    const items = b.length ? b.map((k) => `<span>${esc(k)}</span>`).join('') : '<span class="none">empty</span>';
    return `<div class="bucket${i === step.hot ? ' hot' : ''}"><div class="bi">#${i}</div><div class="chain">${items}</div></div>`;
  });
  return `<div class="buckets">${rows.join('')}</div>`;
}

function renderNet(net, step) {
  const pos = {};
  net.nodes.forEach((n) => { pos[n.id] = n; });
  const hi = new Set(step.hi || []);
  const ok = new Set(step.ok || []);
  const path = new Set([...hi, ...ok, ...(step.cur ? [step.cur] : [])]);
  const edges = net.edges.map(([a, b]) => {
    const on = path.has(a) && path.has(b);
    const p = pos[a];
    const q = pos[b];
    return `<line class="edge${on ? ' hi' : ''}" x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"></line>`;
  }).join('');
  const nodes = net.nodes.map((n) => {
    const state = step.cur === n.id ? 'cur' : (ok.has(n.id) ? 'ok' : (hi.has(n.id) ? 'hi' : ''));
    return `<g class="node ${state}"><circle cx="${n.x}" cy="${n.y}" r="${net.r}"></circle><text x="${n.x}" y="${n.y}">${esc(n.label || n.id)}</text></g>`;
  }).join('');
  return `<div class="net"><svg viewBox="${net.viewBox}" role="img" aria-label="${esc(step.caption)}">${edges}${nodes}</svg></div>`;
}

/* Step player: Back, Next, Play, with a caption for every step */
function mountPlayer(host, topic) {
  const steps = topic.steps();
  let idx = 0;
  let timer = null;
  host.innerHTML = `
    <div class="stage">
      <div class="stage-body"></div>
      <div class="queue-line" hidden></div>
      <p class="caption" aria-live="polite"></p>
      <div class="controls">
        <button class="btn small" type="button" data-go="first">First</button>
        <button class="btn" type="button" data-go="prev">Back</button>
        <button class="btn primary" type="button" data-go="next">Next</button>
        <button class="btn" type="button" data-go="play" aria-pressed="false">Play</button>
        <span class="label step-no"></span>
      </div>
    </div>`;
  const body = $('.stage-body', host);
  const cap = $('.caption', host);
  const qline = $('.queue-line', host);
  const count = $('.step-no', host);
  const btn = (k) => $(`[data-go="${k}"]`, host);
  const stop = () => {
    if (timer) clearInterval(timer);
    timer = null;
    btn('play').setAttribute('aria-pressed', 'false');
    btn('play').textContent = 'Play';
  };
  const draw = () => {
    const s = steps[idx];
    body.innerHTML = topic.renderer === 'buckets' ? renderBuckets(s) : (topic.renderer === 'net' ? renderNet(topic.net, s) : renderCells(s));
    cap.textContent = s.caption;
    count.textContent = `Step ${idx + 1} of ${steps.length}`;
    if (s.queue) {
      qline.hidden = false;
      qline.textContent = s.queue.length ? `Queue: ${s.queue.join(' → ')}` : 'Queue: empty';
    } else {
      qline.hidden = true;
    }
    btn('prev').disabled = idx === 0;
    btn('next').disabled = idx === steps.length - 1;
  };
  host.addEventListener('click', (e) => {
    const b = e.target.closest('[data-go]');
    if (!b) return;
    const k = b.dataset.go;
    if (k === 'play') {
      if (timer) { stop(); return; }
      if (idx >= steps.length - 1) idx = 0;
      timer = setInterval(() => {
        if (idx >= steps.length - 1) { stop(); return; }
        idx++;
        draw();
      }, 1500);
      timers.push(timer);
      btn('play').setAttribute('aria-pressed', 'true');
      btn('play').textContent = 'Pause';
      draw();
      return;
    }
    stop();
    if (k === 'first') idx = 0;
    if (k === 'prev') idx = Math.max(0, idx - 1);
    if (k === 'next') idx = Math.min(steps.length - 1, idx + 1);
    draw();
  });
  draw();
}

/* Cost explorer for Big-O: how work grows with the input size */
function mountScale(host) {
  const rows = [
    ['O(1)', () => 1],
    ['O(log n)', (n) => Math.log2(n)],
    ['O(n)', (n) => n],
    ['O(n log n)', (n) => n * Math.log2(n)],
    ['O(n²)', (n) => n * n]
  ];
  host.innerHTML = `
    <div class="stage">
      <div class="label">Input size: <strong class="n-out"></strong> items</div>
      <input id="n-range" class="n-range" type="range" min="1" max="6" step="1" value="6" aria-label="Input size, as a power of ten">
      <div class="scale"></div>
      <p class="note">Time assumes a hundred million simple steps per second. The bars compare growth; real machines vary.</p>
    </div>`;
  const range = $('.n-range', host);
  const draw = () => {
    const n = 10 ** Number(range.value);
    $('.n-out', host).textContent = n.toLocaleString('en-IN');
    $('.scale', host).innerHTML = rows.map(([name, f]) => {
      const ops = f(n);
      const pct = Math.min(100, ((Math.log10(ops) + 1) / 13) * 100);
      return `<div class="scale-row"><div class="name">${name}</div><div class="bar"><i style="width:${pct.toFixed(1)}%"></i></div><div class="val">${Math.round(ops).toLocaleString('en-IN')} steps · ${fmtTime(ops / 1e8)}</div></div>`;
    }).join('');
  };
  range.addEventListener('input', draw);
  draw();
}

    ['Prefix matches as you type', 'Trie'],
    ['Groups that merge, plus "same group?" questions', 'Union-find'],
    ['Cheapest route when no road has negative cost', 'Dijkstra with a heap'],
    ['Fixed-size cache that drops the least recently used item', 'LRU cache: hash map plus linked list'],
    ['A phrase found in one pass over a long text', 'KMP failure table']
  ];
  const rows = TOPICS.flatMap((t) => t.ops.map(([op, cost, note]) =>
    `<tr><td>${esc(t.name)}</td><td>${esc(op)}</td><td class="cost">${esc(cost)}</td><td>${esc(note)}</td></tr>`));
  return `
    <p class="label">Reference</p>
    <h1>Cheat sheet</h1>
    <p class="lead">Keep this open while you practise. Costs are for the typical case unless a row says otherwise.</p>
    <h2>Which structure, when</h2>
    <div class="tbl"><table><thead><tr><th>You need</th><th>Reach for</th></tr></thead><tbody>${picks.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join('')}</tbody></table></div>
    <h2>All the costs</h2>
    <div class="tbl"><table><thead><tr><th>Topic</th><th>Operation</th><th>Cost</th><th>Why</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

function renderNav(route) {
  const link = (id, label, num, done) => `<a href="#${id}"${route === id ? ' aria-current="page"' : ''}>${num ? `<span class="n">${num}</span>` : ''}<span>${esc(label)}</span>${done ? '<span class="tick" aria-label="learned">✓</span>' : ''}</a>`;
  $('#nav').innerHTML = link('start', 'Start here', '', false)
    + TOPICS.map((t, i) => link(t.id, t.name, String(i + 1).padStart(2, '0'), !!progress.learned[t.id])).join('')
    + link('practice', 'Practice lab', '', false)
    + link('cheatsheet', 'Cheat sheet', '', false);
}

function renderProgress() {
  const learned = TOPICS.filter((t) => progress.learned[t.id]).length;
  const solved = PROBLEMS.filter((p) => progress.solved[p.id]).length;
  $('#progress-label').textContent = `${learned} of ${TOPICS.length} topics · ${solved} of ${PROBLEMS.length} problems`;
  $('#progress-bar').style.width = `${Math.round(((learned + solved) / (TOPICS.length + PROBLEMS.length)) * 100)}%`;
}

function render() {
  stopTimers();
  const route = currentRoute();
  const idx = TOPICS.findIndex((t) => t.id === route);
  let html;
  if (route === 'start') html = startView();
  else if (route === 'practice') html = practiceView();
  else if (route === 'cheatsheet') html = cheatView();
  else html = topicView(TOPICS[idx], idx);
  $('#view').innerHTML = html;
  renderNav(route);
  renderProgress();
  const current = idx >= 0 ? TOPICS[idx] : null;
  if (current && current.renderer === 'scale') mountScale($('.scale-host'));
  else if (current && current.steps) mountPlayer($('.player-host'), current);
  if (keepScroll) keepScroll = false;
  else window.scrollTo(0, 0);
}
/* ---------- Practice lab: cards, a sandboxed test runner, hints and solutions ---------- */
function practiceView() {
  const counts = TOPICS.map((t) => [t.id, t.name, PROBLEMS.filter((p) => p.topic === t.id).length]).filter((x) => x[2] > 0);
  const chips = [['all', 'All topics', PROBLEMS.length]].concat(counts).map(([id, label, n]) =>
    `<button class="btn small" type="button" data-action="filter" data-topic="${id}" aria-pressed="${practiceFilter === id}">${esc(label)} (${n})</button>`).join('');
  const inTopic = (p) => practiceFilter === 'all' || p.topic === practiceFilter;
  const levelChips = ['all', 'Easy', 'Medium', 'Hard'].map((lv) => {
    const n = PROBLEMS.filter((p) => inTopic(p) && (lv === 'all' || p.level === lv)).length;
    return `<button class="btn small" type="button" data-action="level" data-level="${lv}" aria-pressed="${practiceLevel === lv}">${lv === 'all' ? 'Any level' : lv} (${n})</button>`;
  }).join('');
  const list = PROBLEMS.filter((p) => inTopic(p) && (practiceLevel === 'all' || p.level === practiceLevel));
  return `
    <p class="label">Lab</p>
    <h1>Practice</h1>
    <p class="lead">Each problem starts with a real situation. Write the function, run the tests in a separate worker, and open a hint or the worked solution when you are stuck.</p>
    <div class="filters">${chips}</div>
    <div class="filters">${levelChips}</div>
    <p class="note">${list.length} problem${list.length === 1 ? '' : 's'} shown. Your code is saved in this browser only.</p>
    ${list.map(problemCard).join('')}`;
}

function problemCard(p) {
  const topic = TOPICS.find((t) => t.id === p.topic);
  return `
    <details class="problem card${progress.solved[p.id] ? ' solved' : ''}" data-problem="${p.id}">
      <summary><span class="pt">${esc(p.title)}</span><span class="diff">${esc(p.level)}</span><span class="label">${esc(topic ? topic.name : p.topic)}</span></summary>
      <div class="body">
        <p>${esc(p.story)}</p>
        <p>${esc(p.statement)}</p>
        <pre class="examples">${esc(p.examples)}</pre>
        <label class="label" for="code-${p.id}">${esc(p.fn)}, in JavaScript</label>
        <textarea id="code-${p.id}" class="editor" spellcheck="false">${esc(readDraft(p))}</textarea>
        <div class="actions">
          <button class="btn primary" type="button" data-action="run" data-id="${p.id}">Run tests</button>
          <button class="btn" type="button" data-action="hint" data-id="${p.id}" aria-expanded="false">Hint</button>
          <button class="btn" type="button" data-action="solution" data-id="${p.id}" aria-expanded="false">Solution</button>
          <button class="btn" type="button" data-action="reset" data-id="${p.id}">Reset code</button>
        </div>
        <div class="hint" data-hint="${p.id}" hidden>${esc(p.hint)}</div>
        <pre class="solution" data-solution="${p.id}" hidden>${esc(p.solution)}</pre>
        <div class="results" data-results="${p.id}" aria-live="polite"></div>
      </div>
    </details>`;
}

/* The worker receives the learner's code and the tests, runs each test, and reports back */
const RUNNER_SRC = `
const toList = (arr) => { let head = null; for (let i = arr.length - 1; i >= 0; i--) head = { val: arr[i], next: head }; return head; };
const fromList = (node) => { const out = []; while (node) { out.push(node.val); node = node.next; } return out; };
const toTree = (arr) => {
  if (!arr.length || arr[0] === null) return null;
  const mk = (v) => ({ val: v, left: null, right: null });
  const root = mk(arr[0]);
  const queue = [root];
  let i = 1;
  while (queue.length && i < arr.length) {
    const node = queue.shift();
    if (arr[i] !== null && arr[i] !== undefined) { node.left = mk(arr[i]); queue.push(node.left); }
    i++;
    if (i < arr.length && arr[i] !== null && arr[i] !== undefined) { node.right = mk(arr[i]); queue.push(node.right); }
    i++;
  }
  return root;
};
const buildNodes = (arr) => { const nodes = arr.map((v) => ({ val: v, next: null })); for (let i = 0; i + 1 < nodes.length; i++) nodes[i].next = nodes[i + 1]; return nodes; };
const withCycle = (arr, pos) => { const nodes = buildNodes(arr); if (nodes.length && pos >= 0) nodes[nodes.length - 1].next = nodes[pos]; return nodes.length ? nodes[0] : null; };
const sharedTails = (pa, pb, common) => { const tailNodes = buildNodes(common); const shared = tailNodes.length ? tailNodes[0] : null; const a = buildNodes(pa); const b = buildNodes(pb); if (a.length) a[a.length - 1].next = shared; if (b.length) b[b.length - 1].next = shared; return [a.length ? a[0] : shared, b.length ? b[0] : shared]; };
const asArray = (x) => ((x === null || (typeof x === 'object' && !Array.isArray(x) && 'val' in x)) ? fromList(x) : x);
const canon = (v) => JSON.stringify(v.map((x) => JSON.stringify(x)).sort());
self.onmessage = (e) => {
  const code = e.data.code;
  const name = e.data.name;
  const tests = e.data.tests;
  const results = [];
  for (const t of tests) {
    try {
      const isBad = (v) => v >= t.bad;
      const fn = new Function('isBad', code + '\\nreturn ' + name + ';')(isBad);
      if (t.kind === 'ops') {
        const obj = new fn(...(t.init || []));
        const out = t.ops.map(([m, ...a]) => { const r = obj[m](...a); return r === undefined ? null : r; });
        results.push({ pass: JSON.stringify(out) === JSON.stringify(t.expect), got: JSON.stringify(out), expect: JSON.stringify(t.expect) });
        continue;
      }
      let args = t.args.slice();
      if (t.kind === 'tree') args = [toTree(t.args[0])];
      if (t.kind === 'list') args = t.args.map((a) => (Array.isArray(a) ? toList(a) : a));
      if (t.kind === 'cycle') args = [withCycle(t.args[0], t.args[1])];
      if (t.kind === 'shared') args = sharedTails(t.args[0], t.args[1], t.args[2]);
      if (t.kind === 'multi') args = [t.args[0].map((a) => toList(a))];
      let got = fn(...args);
      if (t.kind === 'list' || t.kind === 'shared' || t.kind === 'multi') got = asArray(got);
      const same = t.kind === 'set' ? canon(got) === canon(t.expect) : JSON.stringify(got) === JSON.stringify(t.expect);
      results.push({ pass: same, got: JSON.stringify(got), expect: JSON.stringify(t.expect) });
    } catch (err) {
      results.push({ pass: false, error: String((err && err.message) || err) });
    }
  }
  self.postMessage(results);
};
`;

function runTests(problem, code) {
  return new Promise((resolve) => {
    let worker = null;
    let url = null;
    let timer = null;
    const finish = (out) => {
      if (timer) clearTimeout(timer);
      if (worker) worker.terminate();
      if (url) URL.revokeObjectURL(url);
      resolve(out);
    };
    try {
      url = URL.createObjectURL(new Blob([RUNNER_SRC], { type: 'text/javascript' }));
      worker = new Worker(url);
    } catch (err) {
      finish({ error: 'This viewer cannot start the test runner. Copy the code into your own editor to test it.' });
      return;
    }
    timer = setTimeout(() => finish({ error: 'Stopped after 2 seconds. The code may loop forever.' }), 2000);
    worker.onmessage = (e) => finish({ results: e.data });
    worker.onerror = () => finish({ error: 'The test runner stopped unexpectedly. Copy the code into your own editor to test it.' });
    worker.postMessage({ code: code, name: problem.fn, tests: problem.tests });
  });
}

async function runProblem(id, button) {
  const p = PROBLEMS.find((x) => x.id === id);
  const box = $(`[data-results="${id}"]`);
  const editor = $(`#code-${id}`);
  if (!p || !box || !editor) return;
  button.disabled = true;
  box.innerHTML = '<div class="res">Running the tests…</div>';
  const out = await runTests(p, editor.value);
  button.disabled = false;
  if (!$(`[data-results="${id}"]`)) return;
  if (out.error) { box.innerHTML = `<div class="res fail">${esc(out.error)}</div>`; return; }
  const friendly = (m) => (/eval|Content Security|unsafe-eval/i.test(m)
    ? 'This viewer blocks running typed code. Copy the code into your own editor to test it.'
    : m);
  const rows = out.results.map((r, i) => {
    if (r.error) return `<div class="res fail">Test ${i + 1}: ${esc(friendly(r.error))}</div>`;
    if (r.pass) return `<div class="res pass">Test ${i + 1} passed: returned ${esc(r.got)}</div>`;
    return `<div class="res fail">Test ${i + 1} failed: returned ${esc(r.got)}, expected ${esc(r.expect)}</div>`;
  }).join('');
  const total = out.results.length;
  const passed = out.results.filter((r) => r.pass).length;
  const all = passed === total;
  if (all) {
    progress.solved[id] = true;
    saveProgress();
    const card = $(`[data-problem="${id}"]`);
    if (card) card.classList.add('solved');
    renderProgress();
    renderNav(currentRoute());
  }
  box.innerHTML = `${rows}<div class="verdict ${all ? 'pass' : 'fail'}">${all ? `All ${total} tests passed. Problem solved.` : `${passed} of ${total} passed. Keep going.`}</div>`;
}

function resetCode(id) {
  const p = PROBLEMS.find((x) => x.id === id);
  const editor = $(`#code-${id}`);
  if (p && editor) editor.value = p.starter;
  clearDraft(id);
}

function toggleBox(selector, button) {
  const box = $(selector);
  if (!box) return;
  box.hidden = !box.hidden;
  button.setAttribute('aria-expanded', String(!box.hidden));
}

const EXTRA_CSS = `
.topic-card h3 a { color: inherit; text-decoration: none; }
.topic-card h3 a:hover { text-decoration: underline; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; }
.problem.card { padding: 14px 16px; }
.problem summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.problem summary::-webkit-details-marker { display: none; }
.problem summary::before { content: "+"; font: 600 18px/1 "JetBrains Mono", ui-monospace, monospace; color: var(--accent); }
.problem[open] summary::before { content: "−"; }
.problem .pt { font: 700 18px/1.3 "Bricolage Grotesque", system-ui, sans-serif; }
.problem.solved .pt::after { content: " ✓"; color: var(--ok); }
.problem .body { padding: 12px 0 6px; }
.bucket .chain .none { border-style: dashed; background: transparent; color: var(--soft); }
.verdict.pass { color: var(--ok); }
.verdict.fail { color: var(--bad); }
.topic-nav { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
.net { margin: 6px 0; }
.theory { margin: 10px 0; padding: 12px 14px; border-radius: 6px; background: var(--card); border: 1px solid var(--rule); border-left: 4px solid var(--soft); }
.theory summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; list-style: none; }
.theory summary::-webkit-details-marker { display: none; }
.theory summary .pt { font: 700 17px/1.3 "Bricolage Grotesque", system-ui, sans-serif; }
.theory ul { margin: 10px 0 0; }
.theory.lv-basic { border-left-color: var(--ok); }
.theory.lv-mid { border-left-color: var(--accent); }
.theory.lv-adv { border-left-color: var(--bad); }
.theory.lv-basic .diff { color: var(--ok); border-color: var(--ok); }
.theory.lv-mid .diff { color: var(--accent); border-color: var(--accent); }
.theory.lv-adv .diff { color: var(--bad); border-color: var(--bad); }
`;

function init() {
  const extra = document.createElement('style');
  extra.textContent = EXTRA_CSS;
  document.head.appendChild(extra);
  const view = $('#view');
  view.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const act = el.dataset.action;
    const id = el.dataset.id;
    if (act === 'filter') { practiceFilter = el.dataset.topic; keepScroll = true; render(); }
    else if (act === 'level') { practiceLevel = el.dataset.level; keepScroll = true; render(); }
    else if (act === 'practice-topic') { practiceFilter = el.dataset.topic; practiceLevel = 'all'; go('practice'); }
    else if (act === 'run') runProblem(id, el);
    else if (act === 'hint') toggleBox(`[data-hint="${id}"]`, el);
    else if (act === 'solution') toggleBox(`[data-solution="${id}"]`, el);
    else if (act === 'reset') resetCode(id);
  });
  view.addEventListener('input', (e) => {
    if (e.target.classList && e.target.classList.contains('editor')) {
      writeDraft(e.target.id.replace('code-', ''), e.target.value);
    }
  });
  view.addEventListener('change', (e) => {
    const cb = e.target.closest ? e.target.closest('[data-learn]') : null;
    if (!cb) return;
    progress.learned[cb.dataset.learn] = cb.checked;
    saveProgress();
    renderNav(currentRoute());
    renderProgress();
  });
  window.addEventListener('hashchange', render);
  render();
}

init();
/*@@APP*/
</script>
